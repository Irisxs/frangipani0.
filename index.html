<!DOCTYPE html>
 <html lang="en">
 <head>
 <meta name="viewport"
content="width=device-width,initial-scale=1.0'>
<title>Frangipani Bloom</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}

body{

  overflow:hidden;

  background:radial-gradient(ellipse at center,#30251c,#100b09 60%,#020203);

  color:#f8e8cf;

  font-family:Georgia,serif;

}

canvas{display:block}

.ui{

  position:absolute;

  bottom:8%;

  width:100%;

  text-align:center;

  pointer-events:none;

}

h1{

  font-size:23px;

  font-weight:400;

  letter-spacing:7px;

}

p{

  margin-top:12px;

  font-size:10px;

  letter-spacing:5px;

  color:#c3a77e;

}

button{

  pointer-events:auto;

  margin-top:25px;

  padding:12px 28px;

  border:1px solid #a68b5e;

  border-radius:30px;

  background:transparent;

  color:#f7e7c8;

  letter-spacing:2px;

  cursor:pointer;

}

button:hover{

  background:#a68b5e;

  color:#100d0b;

}

</style>

<script type=“importmap”>

{

 “imports”:{

  “three”:”https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js”

 }

}

</script>

</head>

<body>

<div class=“ui”>

  <h1>FRANGIPANI</h1>

  <p>A LITTLE FLOWER OF BEAUTY</p>

  <button id=“replay”>BLOOM AGAIN ✧</button>

</div>

<script type=“module”>

import * as THREE from “three”;

// SCENE

const scene=new THREE.Scene();

scene.background=new THREE.Color(“#100b09”);

scene.fog=new THREE.Fog(“#100b09”,9,18);

const camera=new THREE.PerspectiveCamera(

  38,innerWidth/innerHeight,0.1,100

);

camera.position.set(0,0,8.5);

// RENDERER

const renderer=new THREE.WebGLRenderer({

  antialias:true,

  alpha:true

});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.outputColorSpace=THREE.SRGBColorSpace;

renderer.toneMapping=THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.3;

document.body.appendChild(renderer.domElement);

// LIGHTS

scene.add(new THREE.AmbientLight(0xffe8cc,1.4));

function addLight(color,intensity,x,y,z){

  const light=new THREE.PointLight(color,intensity,30);

  light.position.set(x,y,z);

  scene.add(light);

}

addLight(0xffd49a,75,-3,4,5);

addLight(0xffffff,55,3,2,4);

addLight(0xffae43,30,0,-3,2);

// FLOWER

const flower=new THREE.Group();

scene.add(flower);

const petals=[];

// CREATE CURVED PETAL

function makePetal(){

  const rows=40;

  const cols=24;

  const positions=[];

  const colors=[];

  const indices=[];

  const cream=new THREE.Color(“#fff5e9”);

  const white=new THREE.Color(“#fffefa”);

  const yellow=new THREE.Color(“#e9a52e”);

  for(let i=0;i<=rows;i++){

    const s=i/rows;

    const width=

      0.69*Math.pow(Math.sin(Math.PI*s),0.72)

      *(0.7+0.3*s);

    for(let j=0;j<=cols;j++){

      const u=j/cols*2-1;

      const x=u*width;

      const y=s*1.95;

      const z=

        0.22*Math.sin(Math.PI*s)

        +0.15*u*u*Math.sin(Math.PI*s)

        +0.12*s*s;

      positions.push(x,y,z);

      const blend=THREE.MathUtils.smoothstep(s,0.02,0.42);

      const color=yellow.clone()

        .lerp(cream,blend)

        .lerp(white,0.35*(1-Math.abs(u)));

      colors.push(color.r,color.g,color.b);

    }

  }

  for(let i=0;i<rows;i++){

    for(let j=0;j<cols;j++){

      const a=i*(cols+1)+j;

      const b=a+cols+1;

      indices.push(a,b,a+1);

      indices.push(b,b+1,a+1);

    }

  }

  const geo=new THREE.BufferGeometry();

  geo.setAttribute(“position”,

    new THREE.Float32BufferAttribute(positions,3));

  geo.setAttribute(“color”,

    new THREE.Float32BufferAttribute(colors,3));

  geo.setIndex(indices);

  geo.computeVertexNormals();

  const mat=new THREE.MeshPhysicalMaterial({

    vertexColors:true,

    side:THREE.DoubleSide,

    roughness:0.3,

    clearcoat:0.4,

    clearcoatRoughness:0.2,

    sheen:0.8,

    sheenColor:new THREE.Color(“#fff0d9”)

  });

  return new THREE.Mesh(geo,mat);

}

// FIVE PETALS

for(let i=0;i<5;i++){

  const group=new THREE.Group();

  const mesh=makePetal();

  group.add(mesh);

  const angle=i*Math.PI*2/5+Math.PI/2;

  group.rotation.order=“XYZ”;

  group.rotation.z=angle;

  group.rotation.x=1.12;

  flower.add(group);

  petals.push({

    group,

    mesh,

    angle,

    phase:i*1.15,

    original:mesh.
   geometry.attributes.position.array.slice()

  });

}

// FLOWER CENTER

const centerGroup=new THREE.Group();

flower.add(centerGroup);

const center=new THREE.Mesh(

  new THREE.SphereGeometry(0.23,48,32),

  new THREE.MeshPhysicalMaterial({

    color:”#f5c04e”,

    emissive:”#a95c12”,

    emissiveIntensity:0.35,

    roughness:0.32,

    clearcoat:0.7

  })

);

center.scale.setScalar(0.001);

centerGroup.add(center);

// GOLDEN STAMENS

for(let i=0;i<9;i++){

  const a=i*Math.PI*2/9;

  const stamen=new THREE.Mesh(

    new THREE.SphereGeometry(0.035,16,12),

    new THREE.MeshStandardMaterial({

      color:”#fff0a6”,

      emissive:”#d88c22”,

      emissiveIntensity:0.4

    })

  );

  stamen.position.set(

    Math.cos(a)*0.13,

    Math.sin(a)*0.13,

    0.19

  );

  centerGroup.add(stamen);

}

// GOLDEN PARTICLES

const stars=[];

for(let i=0;i<45;i++){

  const star=new THREE.Mesh(

    new THREE.SphereGeometry(0.015,8,8),

    new THREE.MeshBasicMaterial({

      color:”#ffdb91”,

      transparent:true

    })

  );

  star.position.set(

    (Math.random()-0.5)*8,

    (Math.random()-0.5)*7,

    -1+Math.random()*2

  );

  scene.add(star);

  stars.push({

    mesh:star,

    phase:Math.random()*6,

    baseY:star.position.y,

    speed:0.3+Math.random()*0.5

  });

}

// BLOOM ANIMATION

let start=performance.now();

const duration=6000;

function ease(t){

  return t*t*(3-2*t);

}

function animate(now){

  requestAnimationFrame(animate);

  const time=now*0.001;

  const elapsed=(now-start)/duration;

  petals.forEach(p=>{

    const delay=petals.indexOf(p)*0.105;

    const progress=THREE.MathUtils.clamp(

      (elapsed-delay)/(1-delay),0,1

    );

    const e=ease(progress);

    // Natural opening

    p.group.rotation.x=1.12*(1-e)+0.07;

    // Organic movement

    p.group.rotation.z=

      p.angle+Math.sin(time*0.8+p.phase)*0.018*e;

    p.group.rotation.y=

      Math.sin(time*0.65+p.phase)*0.035*e;

    // Gradual growth

    const size=0.12+0.88*e;

    p.group.scale.set(size,size,size);

    // Gentle petal movement

    const attr=p.mesh.geometry.attributes.position;

    const original=p.original;

    for(let k=0;k<original.length;k+=3){

      const s=original[k+1]/1.95;

      attr.array[k+2]=original[k+2]+

        Math.sin(time*1.1+s*3+p.phase)*0.018*s*e;

    }

    attr.needsUpdate=true;

    p.mesh.geometry.computeVertexNormals();

  });

  // Center appears gradually

  const cp=ease(

    THREE.MathUtils.clamp((elapsed-0.42)/0.3,0,1)

  );

  center.scale.setScalar(cp);

  // Gentle floating

  flower.rotation.z=Math.sin(time*0.35)*0.018;

  flower.rotation.x=0.03+Math.sin(time*0.5)*0.012;

  flower.position.y=Math.sin(time*0.65)*0.055;

  // Moving particles

  stars.forEach(s=>{

    s.mesh.position.y=

      s.baseY+Math.sin(time*s.speed+s.phase)*0.12;

    s.mesh.material.opacity=

      0.35+0.65*(0.5+0.5*Math.sin(time*2+s.phase));

  });

  renderer.render(scene,camera);

}

requestAnimationFrame(animate);

// REPLAY

document.getElementById(“replay”).onclick=()=>{

  start=performance.now();

};

// RESPONSIVE

window.addEventListener(“resize”,()=>{

  camera.aspect=innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);

});

</script>

</body>

</html>
